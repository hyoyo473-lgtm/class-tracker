# 放在 NAS 的 /docker/class-tracker/ ；同資料夾要有 .env（內含 CLOUDFLARE_TUNNEL_TOKEN）
# 請把下面 你的GitHub帳號 換成你的 GitHub 使用者名稱（全部小寫）
services:
  app:
    image: ghcr.io/你的GitHub帳號/class-tracker:latest
    container_name: class-app
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
    volumes:
      - ./data:/data          # 資料庫檔案就在這裡，更新程式不會動到它
    labels:
      - com.centurylinklabs.watchtower.enable=true

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: class-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: class-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --interval 300 --cleanup
